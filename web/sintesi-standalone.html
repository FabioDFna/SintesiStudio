  <script>
const SYSTEM_ROLE = `Ruolo: Sei un Esperto di Sintesi Documentale e Assistente allo Studio ad Alta Efficienza.
Obiettivo: aiutare l'utente a prepararsi per nuove opportunità lavorative, ottimizzando tempi di lettura e comprensione di grandi volumi di testo.
Rispondi sempre in italiano, con prosa fluida e professionale.`;

function summaryPrompt(excerpt, partLabel, isFinalMerge) {
  if (isFinalMerge) {
    return `${SYSTEM_ROLE}

Unisci e perfeziona le seguenti sintesi parziali in UN UNICO riassunto ampio, approfondito e fluido.
- Non usare elenchi puntati superficiali: cattura concetti chiave, struttura logica e messaggi principali.
- Dividi per capitoli o macro-aree con titoli chiari (es. ## Capitolo 1: ...).
- Elimina ripetizioni tra le parti.

SINTESI PARZIALI:
${excerpt}`;
  }
  return `${SYSTEM_ROLE}

Analizza questo estratto (${partLabel}) del documento e produci una sintesi ampio spettro.
- Prosa continua e rapida da leggere, non bullet point secchi.
- Evidenzia struttura logica e messaggi principali.
- Usa sottotitoli per macro-aree presenti in questo estratto.

ESTRATTO:
${excerpt}`;
}

function audioPrompt(summaryOrExcerpt, title) {
  return `${SYSTEM_ROLE}

Crea una sezione "Pronta per la lettura vocale" (Audio-Friendly) per il documento "${title}".
- Simula un co-conduttore di podcast che racconta il libro in modo dinamico.
- Frasi brevi-medie, ritmo parlato, transizioni naturali.
- Evidenzia solo ciò che è più interessante e memorabile.
- Nessun markdown complesso: solo testo leggibile da TTS.
- Lunghezza: circa 8-15 minuti di ascolto.

BASE (sintesi o estratto):
${summaryOrExcerpt}`;
}

function qaPrompt(question, documentExcerpt) {
  return `${SYSTEM_ROLE}

Modalità Q&A: rispondi SOLO in base al testo del documento fornito.
Se la risposta non è nel testo, dillo esplicitamente senza inventare.
Cita capitoli o sezioni quando possibile.

TESTO DOCUMENTO (estratti pertinenti):
${documentExcerpt}

DOMANDA UTENTE:
${question}`;
}



/** Chunk più piccoli = meno chiamate API (importante per quota free tier). */
const CHUNK_SIZE = 55_000;
const OVERLAP = 2_000;

function chunkText(text) {
  if (text.length <= CHUNK_SIZE) return [text];
  const chunks = [];
  let start = 0;
  while (start < text.length) {
    let end = Math.min(start + CHUNK_SIZE, text.length);
    if (end < text.length) {
      const minBreak = start + CHUNK_SIZE / 2;
      const para = text.lastIndexOf("\n\n", end);
      const dot = text.lastIndexOf(".", end);
      const breakAt =
        (para > minBreak ? para : -1) >= 0 ? para :
        (dot > minBreak ? dot : -1) >= 0 ? dot : end;
      end = breakAt;
    }
    chunks.push(text.slice(start, end));
    if (end >= text.length) break;
    start = Math.max(end - OVERLAP, start + 1);
  }
  return chunks;
}

function excerptForQuestion(fullText, question, maxLen = 80_000) {
  const keywords = question
    .toLowerCase()
    .split(/\W+/)
    .filter((w) => w.length > 4)
    .slice(0, 12);
  if (keywords.length === 0) return fullText.slice(0, maxLen);
  const paragraphs = fullText.split(/\n\n+/);
  const top = paragraphs
    .map((p) => ({
      p,
      score: keywords.filter((k) => p.toLowerCase().includes(k)).length,
    }))
    .filter((x) => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 40)
    .map((x) => x.p);
  const selected = top.length ? top.join("\n\n") : fullText.slice(0, maxLen);
  return selected.length > maxLen ? selected.slice(0, maxLen) : selected;
}



const DB_NAME = "sintesi_studio";
const STORE = "documents";
const CHAT = "chat";

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
      }
      if (!db.objectStoreNames.contains(CHAT)) {
        const chat = db.createObjectStore(CHAT, { keyPath: "id", autoIncrement: true });
        chat.createIndex("documentId", "documentId", { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode = "readonly") {
  return openDb().then((db) => db.transaction(store, mode).objectStore(store));
}

async function listDocuments() {
  const store = await tx(STORE);
  return new Promise((resolve, reject) => {
    const req = store.getAll();
    req.onsuccess = () =>
      resolve(
        (req.result || []).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
      );
    req.onerror = () => reject(req.error);
  });
}

async function getDocument(id) {
  const store = await tx(STORE);
  return new Promise((resolve, reject) => {
    const req = store.get(Number(id));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveDocument(doc) {
  const store = await tx(STORE, "readwrite");
  return new Promise((resolve, reject) => {
    const payload = { ...doc, createdAt: doc.createdAt || Date.now() };
    const req = doc.id ? store.put(payload) : store.add(payload);
    req.onsuccess = () => {
      const newId = req.result;
      resolve(typeof newId === "number" ? newId : doc.id);
    };
    req.onerror = () => reject(req.error);
  });
}

async function deleteDocument(id) {
  const store = await tx(STORE, "readwrite");
  await new Promise((res, rej) => {
    const r = store.delete(Number(id));
    r.onsuccess = res;
    r.onerror = () => rej(r.error);
  });
  const chatStore = await tx(CHAT, "readwrite");
  const all = await new Promise((res, rej) => {
    const r = chatStore.getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
  for (const m of all.filter((x) => x.documentId === Number(id))) {
    await new Promise((res, rej) => {
      const r = chatStore.delete(m.id);
      r.onsuccess = res;
      r.onerror = () => rej(r.error);
    });
  }
}

async function listMessages(documentId) {
  const store = await tx(CHAT);
  return new Promise((resolve, reject) => {
    const req = store.index("documentId").getAll(Number(documentId));
    req.onsuccess = () =>
      resolve(
        (req.result || []).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
      );
    req.onerror = () => reject(req.error);
  });
}

async function addMessage(documentId, role, content) {
  const store = await tx(CHAT, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.add({
      documentId: Number(documentId),
      role,
      content,
      createdAt: Date.now(),
    });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}



/* prompts inlined */
  /* chunker inlined */

  const DEFAULT_MODEL = "gemini-1.5-flash";
  const FREE_TIER_MODELS = [
    "gemini-1.5-flash",
    "gemini-2.5-flash",
    "gemini-2.5-flash-lite",
    "gemini-2.0-flash-lite",
  ];

  const MIN_GAP_MS = 3500;
  let lastCallAt = 0;

  function buildModelChain(preferred) {
    const chain = [];
    if (preferred?.trim()) chain.push(preferred.trim());
    for (const m of FREE_TIER_MODELS) {
      if (!chain.includes(m)) chain.push(m);
    }
    return chain;
  }

  function sleep(ms) {
    return new Promise((r) => setTimeout(r, ms));
  }

  async function pace() {
    const wait = MIN_GAP_MS - (Date.now() - lastCallAt);
    if (wait > 0) await sleep(wait);
    lastCallAt = Date.now();
  }

  function parseRetrySeconds(msg) {
    const m = msg?.match(/retry in ([\d.]+)s/i);
    return m ? parseFloat(m[1]) : null;
  }

  function isRetryable(status, msg) {
    if (status === 429 || status === 503 || status === 404) return true;
    const l = (msg || "").toLowerCase();
    return (
      l.includes("quota") ||
      l.includes("429") ||
      l.includes("rate") ||
      l.includes("resource exhausted") ||
      l.includes("not found") ||
      l.includes("limit: 0")
    );
  }

  function parseResponseText(data) {
    const parts = data?.candidates?.[0]?.content?.parts;
    if (!parts?.length) throw new Error("Risposta vuota da Gemini.");
    const text = parts.map((p) => p.text || "").join("").trim();
    if (!text) throw new Error("Nessun testo nella risposta.");
    return text;
  }

  async function callGeminiRest(apiKey, prompt, model) {
    await pace();
    const url =
      "https://generativelanguage.googleapis.com/v1beta/models/" +
      model +
      ":generateContent?key=" +
      encodeURIComponent(apiKey);
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.4, maxOutputTokens: 8192 },
      }),
    });

    let data = {};
    try {
      data = await res.json();
    } catch (_) {}

    if (!res.ok) {
      const msg = data?.error?.message || res.statusText || "HTTP " + res.status;
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    return parseResponseText(data);
  }

  async function generate(apiKey, prompt, preferredModel = DEFAULT_MODEL) {
    const models = buildModelChain(preferredModel);
    const errors = [];

    for (const model of models) {
      try {
        return await callGeminiRest(apiKey, prompt, model);
      } catch (e) {
        const msg = e.message || String(e);
        errors.push(model + ": " + msg.slice(0, 120));
        if (!isRetryable(e.status, msg)) throw new Error(msg);
        const sec = parseRetrySeconds(msg);
        if (sec) await sleep(Math.min(sec * 1000, 90000));
      }
    }

    throw new Error(
      "Quota API Gemini esaurita. Attendi 2-5 minuti o cambia modello in Impostazioni.\n" +
        errors.slice(0, 3).join("\n")
    );
  }

  async function buildFullSummary(apiKey, fullText, preferredModel, onProgress) {
    const chunks = chunkText(fullText);
    if (chunks.length === 1) {
      return generate(
        apiKey,
        summaryPrompt(chunks[0], "documento completo", false),
        preferredModel
      );
    }
    const partials = [];
    for (let i = 0; i < chunks.length; i++) {
      onProgress?.("Sintesi parte " + (i + 1) + " di " + chunks.length + "…");
      partials.push(
        await generate(
          apiKey,
          summaryPrompt(chunks[i], "parte " + (i + 1) + " di " + chunks.length, false),
          preferredModel
        )
      );
    }
    onProgress?.("Unione finale…");
    const merged = partials.map((s, i) => "### Parte " + (i + 1) + "\n" + s).join("\n\n");
    return generate(apiKey, summaryPrompt(merged, "finale", true), preferredModel);
  }

  async function buildAudioScript(apiKey, title, summary, fullText, preferredModel) {
    const base = summary?.trim() ? summary : fullText.slice(0, 60_000);
    return generate(apiKey, audioPrompt(base, title), preferredModel);
  }

  async function answerQuestion(apiKey, question, fullText, preferredModel) {
    const excerpt = excerptForQuestion(fullText, question);
    return generate(apiKey, qaPrompt(question, excerpt), preferredModel);
  }

  

function normalizeText(raw, warnings) {
  let text = raw.replace(/\u00a0/g, " ");
  const bad = (text.match(/\ufffd/g) || []).length;
  if (bad > 0) warnings.push(`Rilevati ${bad} caratteri non decodificabili.`);
  text = text.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffd]/g, " ");
  text = text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
  return text;
}

/** Estrazione testo da XHTML/HTML — funziona anche con namespace EPUB. */
function htmlToPlain(html) {
  if (!html || html.length < 10) return "";

  let t = html
    .replace(/<\?xml[\s\S]*?\?>/gi, "")
    .replace(/<!DOCTYPE[\s\S]*?>/gi, "")
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<style[\s\S]*?<\/style>/gi, "");

  const bodyMatch = t.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  if (bodyMatch) t = bodyMatch[1];

  t = t
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/p>/gi, "\n")
    .replace(/<\/div>/gi, "\n")
    .replace(/<\/h[1-6]>/gi, "\n\n")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">")
    .replace(/&quot;/gi, '"')
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(Number(n)))
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/&[a-z]+;/gi, " ");

  let plain = t.replace(/\s+/g, " ").trim();

  if (plain.length < 20) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      plain = (doc.body?.textContent || doc.documentElement?.textContent || "")
        .replace(/\s+/g, " ")
        .trim();
    } catch (_) {}
  }
  return plain;
}

function decodeBytes(bytes) {
  const encodings = ["utf-8", "iso-8859-1", "windows-1252"];
  let best = "";
  let bestScore = -1;
  for (const enc of encodings) {
    try {
      const decoded = new TextDecoder(enc, { fatal: false }).decode(bytes);
      const score = [...decoded].filter((c) => /\p{L}|\p{N}|\s/u.test(c)).length;
      if (score > bestScore) {
        bestScore = score;
        best = decoded;
      }
    } catch (_) {}
  }
  return best;
}

function normalizeZipPath(p) {
  return decodeURIComponentSafe(p.replace(/\\/g, "/").replace(/^\/+/, ""));
}

function decodeURIComponentSafe(s) {
  try {
    return decodeURIComponent(s);
  } catch (_) {
    return s;
  }
}

function resolveHref(baseDir, href) {
  href = decodeURIComponentSafe(href);
  const stack = baseDir ? baseDir.split("/").filter(Boolean) : [];
  for (const part of href.split("/")) {
    if (!part || part === ".") continue;
    if (part === "..") stack.pop();
    else stack.push(part);
  }
  return stack.join("/");
}

function buildZipIndex(zip) {
  const index = new Map();
  for (const path of Object.keys(zip.files)) {
    if (zip.files[path].dir) continue;
    const norm = normalizeZipPath(path);
    index.set(norm, path);
    index.set(norm.toLowerCase(), path);
    const base = norm.split("/").pop();
    if (base) index.set(base.toLowerCase(), path);
  }
  return index;
}

function getZipFile(zip, index, logicalPath) {
  const norm = normalizeZipPath(logicalPath);
  let key = index.get(norm) || index.get(norm.toLowerCase());
  if (key) return zip.file(key);

  const base = norm.split("/").pop()?.toLowerCase();
  if (!base) return null;
  for (const [k, v] of index.entries()) {
    if (k === base || k.endsWith("/" + base)) return zip.file(v);
  }
  return null;
}

const TEXT_MEDIA =
  /application\/(xhtml\+xml|html\+xml|xml)|text\/(html|xml)/i;

function isTextResource(mediaType, href) {
  if (mediaType && TEXT_MEDIA.test(mediaType)) return true;
  return /\.(xhtml|html|htm|xht)$/i.test(href || "");
}

function stripXmlNs(xml) {
  return xml.replace(/xmlns(:\w+)?="[^"]*"/gi, "").replace(/<(\/?)(\w+):/g, "<$1");
}

function parseManifestItems(opf, opfDir) {
  const manifest = new Map();
  const clean = stripXmlNs(opf);
  const re = /<item\b([^>]*?)\/?>/gi;
  for (const m of clean.matchAll(re)) {
    const attrs = m[1];
    const id = attrs.match(/\bid\s*=\s*["']([^"']+)["']/i)?.[1];
    const href = attrs.match(/\bhref\s*=\s*["']([^"']+)["']/i)?.[1];
    const mediaType = attrs.match(/\bmedia-type\s*=\s*["']([^"']+)["']/i)?.[1] || "";
    if (id && href) {
      manifest.set(id, { href: resolveHref(opfDir, href), mediaType });
    }
  }
  return manifest;
}

function parseSpineIds(opf) {
  const clean = stripXmlNs(opf);
  return [...clean.matchAll(/<itemref\b[^>]*\bidref\s*=\s*["']([^"']+)["']/gi)].map(
    (m) => m[1]
  );
}

function hasEncryption(zip) {
  return Object.keys(zip.files).some((p) =>
    /encryption\.xml$/i.test(normalizeZipPath(p))
  );
}

async function readContainerRoot(zip) {
  const path = Object.keys(zip.files).find((p) =>
    /meta-inf\/container\.xml$/i.test(normalizeZipPath(p))
  );
  const f = path ? zip.file(path) : zip.file("META-INF/container.xml");
  return f?.async("string");
}

async function extractChapter(zip, index, logicalPath) {
  const zf = getZipFile(zip, index, logicalPath);
  if (!zf) return "";
  const bytes = await zf.async("uint8array");
  return htmlToPlain(decodeBytes(bytes));
}

async function parseEpubZip(file, warnings) {
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const zipIndex = buildZipIndex(zip);

  if (hasEncryption(zip)) {
    warnings.push(
      "EPUB protetto da DRM/encryption: non è possibile estrarre il testo. Usa una copia senza protezione (Calibre, editoriale legale)."
    );
    return { title: file.name, text: "" };
  }

  const container = await readContainerRoot(zip);
  if (!container) throw new Error("EPUB non valido: container.xml mancante");

  const rootfile = container.match(/full-path\s*=\s*["']([^"']+)["']/i)?.[1];
  if (!rootfile) throw new Error("EPUB non valido: percorso OPF mancante");

  const opfPath = normalizeZipPath(rootfile);
  const opf = await getZipFile(zip, zipIndex, opfPath)?.async("string");
  if (!opf) throw new Error(`OPF non trovato: ${opfPath}`);

  const title =
    opf.match(/<dc:title[^>]*>([^<]+)<\/dc:title>/i)?.[1]?.trim() ||
    opf.match(/<title[^>]*>([^<]+)<\/title>/i)?.[1]?.trim() ||
    file.name.replace(/\.[^.]+$/, "");

  const opfDir = opfPath.includes("/") ? opfPath.slice(0, opfPath.lastIndexOf("/")) : "";
  const manifest = parseManifestItems(opf, opfDir);
  const spineIds = parseSpineIds(opf);
  const parts = [];
  const seen = new Set();

  async function pushText(logicalPath, label) {
    const key = logicalPath.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    const plain = await extractChapter(zip, zipIndex, logicalPath);
    if (plain.length > 15) parts.push(`## ${label}\n\n${plain}`);
  }

  for (const id of spineIds) {
    const item = manifest.get(id);
    if (item && isTextResource(item.mediaType, item.href)) {
      await pushText(item.href, item.href);
    }
  }

  if (!parts.length) {
    for (const [, item] of manifest) {
      if (isTextResource(item.mediaType, item.href)) {
        await pushText(item.href, item.href);
      }
    }
  }

  if (!parts.length) {
    const htmlFiles = Object.keys(zip.files)
      .filter((p) => !zip.files[p].dir && /\.(xhtml|html|htm|xht)$/i.test(p))
      .sort();
    warnings.push(`Scansione ZIP: ${htmlFiles.length} file HTML trovati.`);
    for (const p of htmlFiles) {
      await pushText(normalizeZipPath(p), p);
    }
  }

  return { title, text: parts.join("\n\n"), manifestSize: manifest.size };
}

/** Fallback con libreria epub.js (molti EPUB “difficili”). */
async function parseEpubJs(arrayBuffer, fileName, warnings) {
  const epubFn = globalThis.ePub;
  if (!epubFn) return null;

  try {
    const book = epubFn(arrayBuffer, { openAs: "binary" });
    await book.ready;

    const meta = book.package?.metadata || (await book.loaded?.metadata) || {};
    const title =
      meta.title ||
      (typeof meta.creator === "string" ? meta.creator : null) ||
      fileName.replace(/\.[^.]+$/, "");

    await book.loaded.spine;
    const spineItems = book.spine?.spineItems || book.spine?.items || [];
    const texts = [];

    for (const item of spineItems) {
      const href = item.href || item.url;
      if (!href) continue;
      try {
        const doc = await book.load(href);
        const plain = htmlToPlain(
          doc?.documentElement?.outerHTML || doc?.body?.innerHTML || ""
        );
        if (!plain && doc?.body) {
          texts.push(doc.body.textContent.replace(/\s+/g, " ").trim());
        } else if (plain) {
          texts.push(plain);
        }
      } catch (e) {
        warnings.push(`epub.js ${href}: ${e.message}`);
      }
    }

    if (!texts.length) return null;
    warnings.push("Testo estratto con motore epub.js (fallback).");
    return { title, text: texts.join("\n\n") };
  } catch (e) {
    warnings.push(`epub.js fallito: ${e.message}`);
    return null;
  }
}

async function parseEpub(file, warnings) {
  if (!globalThis.JSZip) throw new Error("JSZip non caricato");

  const buffer = await file.arrayBuffer();
  let result = await parseEpubZip(file, warnings);
  let text = normalizeText(result.text, warnings);

  if (text.length < 200) {
    const fallback = await parseEpubJs(buffer, file.name, warnings);
    if (fallback?.text) {
      result.title = fallback.title || result.title;
      text = normalizeText(fallback.text, warnings);
    }
  }

  if (text.length < 50) {
    warnings.push(
      "EPUB: nessun testo estratto. Possibili cause: DRM (Amazon/Kobo), solo immagini, o file corrotto. Prova a esportare senza DRM con Calibre."
    );
  }

  return { title: result.title, text };
}

async function parsePdf(file, warnings) {
  if (!globalThis.pdfjsLib) throw new Error("PDF.js non caricato");
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const data = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data }).promise;
  const parts = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    try {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const t = content.items.map((it) => it.str).join(" ").trim();
      if (t) parts.push(`--- Pagina ${i} ---\n${t}`);
    } catch (e) {
      warnings.push(`Pagina ${i}: ${e.message}`);
    }
  }
  if (!parts.length) warnings.push("PDF senza testo selezionabile (forse scansione).");
  return normalizeText(parts.join("\n\n"), warnings);
}

async function parseTxt(file, warnings) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  return normalizeText(decodeBytes(bytes), warnings);
}

async function parseFile(file) {
  const warnings = [];
  const name = file.name.toLowerCase();
  let title = file.name.replace(/\.[^.]+$/, "");
  let text = "";
  let format = "txt";

  if (name.endsWith(".pdf")) {
    format = "pdf";
    text = await parsePdf(file, warnings);
  } else if (name.endsWith(".epub") || name.endsWith(".ipub")) {
    format = "epub";
    const r = await parseEpub(file, warnings);
    title = r.title || title;
    text = r.text;
  } else if (name.endsWith(".txt")) {
    format = "txt";
    text = await parseTxt(file, warnings);
  } else {
    throw new Error("Formato non supportato. Usa PDF, EPUB, iPUB o TXT.");
  }

  if (text.length < 200) {
    warnings.push("Testo estratto molto breve: verifica DRM, scansione o prova un altro formato.");
  }

  return { title, format, text, warnings, charCount: text.length };
}



const $ = (sel) => document.querySelector(sel);

let currentDocId = null;
let speaking = false;

function settings() {
  return {
    apiKey: localStorage.getItem("gemini_api_key") || "",
    model: localStorage.getItem("gemini_model") || DEFAULT_MODEL,
  };
}

function saveSettings(apiKey, model) {
  localStorage.setItem("gemini_api_key", apiKey.trim());
  localStorage.setItem("gemini_model", model);
}

function toast(msg, ms = 4000) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), ms);
}

function requireApiKey() {
  const { apiKey } = settings();
  if (!apiKey) {
    throw new Error("Inserisci la API key Gemini in Impostazioni.");
  }
  return apiKey;
}

function showView(name) {
  $("#view-home").classList.toggle("hidden", name !== "home");
  $("#view-doc").classList.toggle("hidden", name !== "doc");
  $("#view-settings").classList.toggle("hidden", name !== "settings");
}

async function renderHome() {
  const list = await db.listDocuments();
  const container = $("#doc-list");
  if (!list.length) {
    container.innerHTML =
      '<p class="meta">Importa PDF, EPUB, iPUB o TXT per sintesi, podcast TTS e Q&A.</p>';
    return;
  }
  container.innerHTML = list
    .map(
      (d) => `
    <div class="card" data-id="${d.id}">
      <h3>${escapeHtml(d.title)}</h3>
      <p class="meta">${d.format?.toUpperCase()} · ${d.charCount} caratteri</p>
      ${d.summary ? '<p class="meta">Sintesi pronta</p>' : ""}
      <button class="secondary delete-btn" data-id="${d.id}" style="margin-top:8px">Elimina</button>
    </div>`
    )
    .join("");

  container.querySelectorAll(".card[data-id]").forEach((card) => {
    card.addEventListener("click", (e) => {
      if (e.target.classList.contains("delete-btn")) return;
      openDoc(card.dataset.id);
    });
  });
  container.querySelectorAll(".delete-btn").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      await db.deleteDocument(btn.dataset.id);
      await renderHome();
    });
  });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function openDoc(id) {
  currentDocId = Number(id);
  const doc = await db.getDocument(currentDocId);
  if (!doc) return;
  $("#doc-title").textContent = doc.title;
  const warn = doc.parseWarnings?.length ? doc.parseWarnings.join("\n") : "";
  $("#doc-warnings").textContent = warn ? `Avvisi: ${warn}` : "";
  $("#doc-warnings").classList.toggle("hidden", !warn);

  $("#summary-out").textContent = doc.summary || "";
  $("#audio-out").textContent = doc.audioScript || "";
  await renderChat();
  showView("doc");
  setTab("summary");
}

async function renderChat() {
  const msgs = await db.listMessages(currentDocId);
  const box = $("#chat-box");
  if (!msgs.length) {
    box.innerHTML = '<p class="meta">Domande basate sul testo completo in memoria.</p>';
    return;
  }
  box.innerHTML = msgs
    .map(
      (m) =>
        `<div class="msg ${m.role}"><strong>${m.role === "user" ? "Tu" : "Assistente"}:</strong> ${escapeHtml(m.content)}</div>`
    )
    .join("");
  box.scrollTop = box.scrollHeight;
}

function setTab(tab) {
  document.querySelectorAll(".tab").forEach((t) => {
    t.classList.toggle("active", t.dataset.tab === tab);
  });
  document.querySelectorAll(".panel").forEach((p) => {
    p.classList.toggle("active", p.id === `panel-${tab}`);
  });
}

async function importFile(file) {
  toast("Importazione in corso…");
  const parsed = await parseFile(file);
  const id = await db.saveDocument({
    title: parsed.title,
    format: parsed.format,
    fullText: parsed.text,
    charCount: parsed.charCount,
    parseWarnings: parsed.warnings,
    summary: null,
    audioScript: null,
  });
  toast("Documento importato");
  await renderHome();
  openDoc(id);
}

async function runAi(fn) {
  $("#loading").classList.remove("hidden");
  try {
    const apiKey = requireApiKey();
    const { model } = settings();
    const doc = await db.getDocument(currentDocId);
    await fn(apiKey, doc, model);
    await openDoc(currentDocId);
  } catch (e) {
    toast(e.message || String(e), 10000);
  } finally {
    $("#loading").classList.add("hidden");
    $("#loading").textContent = "Elaborazione in corso…";
  }
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    toast("Sintesi vocale non supportata su questo browser.");
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "it-IT";
  u.rate = 1;
  speaking = true;
  u.onend = () => (speaking = false);
  window.speechSynthesis.speak(u);
}

function init() {
  $("#btn-settings").addEventListener("click", () => {
    const s = settings();
    $("#api-key").value = s.apiKey;
    $("#model-select").value = s.model;
    showView("settings");
  });

  $("#btn-back-home").addEventListener("click", () => {
    showView("home");
    renderHome();
  });
  $("#btn-back-settings").addEventListener("click", () => {
    showView("home");
    renderHome();
  });
  $("#btn-save-settings").addEventListener("click", () => {
    saveSettings($("#api-key").value, $("#model-select").value);
    toast("Impostazioni salvate");
    showView("home");
    renderHome();
  });

  $("#fab-import").addEventListener("click", () => $("#file-input").click());
  $("#file-input").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (file) {
      try {
        await importFile(file);
      } catch (err) {
        toast(err.message || String(err), 6000);
      }
    }
  });

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => setTab(tab.dataset.tab));
  });

  $("#btn-summary").addEventListener("click", () =>
    runAi(async (apiKey, doc, model) => {
      const summary = await buildFullSummary(apiKey, doc.fullText, model, (msg) => {
        $("#loading").textContent = msg;
      });
      doc.summary = summary;
      await db.saveDocument(doc);
      toast("Sintesi completata");
    })
  );

  $("#btn-audio").addEventListener("click", () =>
    runAi(async (apiKey, doc, model) => {
      const script = await buildAudioScript(
        apiKey,
        doc.title,
        doc.summary || "",
        doc.fullText,
        model
      );
      doc.audioScript = script;
      await db.saveDocument(doc);
      toast("Script podcast pronto");
    })
  );

  $("#btn-play").addEventListener("click", async () => {
    const doc = await db.getDocument(currentDocId);
    if (doc?.audioScript) speak(doc.audioScript);
    else toast("Genera prima lo script podcast");
  });

  $("#btn-stop").addEventListener("click", () => {
    window.speechSynthesis?.cancel();
    speaking = false;
  });

  $("#btn-ask").addEventListener("click", async () => {
    const q = $("#question").value.trim();
    if (!q) return;
    $("#question").value = "";
    $("#loading").classList.remove("hidden");
    try {
      const apiKey = requireApiKey();
      const { model } = settings();
      const doc = await db.getDocument(currentDocId);
      await db.addMessage(currentDocId, "user", q);
      const answer = await answerQuestion(apiKey, q, doc.fullText, model);
      await db.addMessage(currentDocId, "assistant", answer);
      await renderChat();
    } catch (e) {
      toast(e.message || String(e), 8000);
    } finally {
      $("#loading").classList.add("hidden");
    }
  });

  );
  }

  showView("home");
  renderHome();
}

init();

init();
</script>
</body>
